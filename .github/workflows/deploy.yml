name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_DEMO_MODE=false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    runs-on: ubuntu-latest
    needs: build-images
    environment:
      name: staging
      url: https://staging.yugo.do
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Migrations run before the new images take traffic.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm --filter @yugo/api db:deploy

      - name: Deploy to staging
        env:
          TAG: ${{ needs.build-images.outputs.tag }}
          DEPLOY_HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$DEPLOY_HOOK" -d "tag=$TAG"

      - name: Smoke test staging
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://staging.yugo.do/v1/health | grep -q '"status":"ok"'; then
              echo "staging healthy"; exit 0
            fi
            sleep 10
          done
          echo "staging did not become healthy"; exit 1

      - name: E2E against staging
        env:
          PLAYWRIGHT_BASE_URL: https://staging.yugo.do
        run: |
          pnpm --filter @yugo/web exec playwright install --with-deps chromium
          pnpm --filter @yugo/web e2e

  production:
    runs-on: ubuntu-latest
    needs: [build-images, staging]
    # RNF-10: producción exige aprobación manual del entorno protegido.
    environment:
      name: production
      url: https://yugo.do
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm --filter @yugo/api db:deploy

      - name: Deploy to production
        env:
          TAG: ${{ needs.build-images.outputs.tag }}
          DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
        run: curl -fsSL -X POST "$DEPLOY_HOOK" -d "tag=$TAG"

      - name: Smoke test production
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://yugo.do/v1/health | grep -q '"status":"ok"'; then
              echo "production healthy"; exit 0
            fi
            sleep 10
          done
          echo "production did not become healthy"; exit 1
