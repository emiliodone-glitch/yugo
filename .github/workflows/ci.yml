name: CI

on:
  push:
    # La rama por defecto del repositorio hoy no se llama `main`; sin ella
    # aquí, ningún push corría lint, pruebas ni E2E.
    branches: [main, claude/yugo-user-interface-xeq4er]
  pull_request:
  workflow_dispatch:

jobs:
  # Va primero y sin `needs`: es lo único que no tiene vuelta atrás. Un lint que
  # falla se arregla en el commit siguiente; un secreto que entra al historial
  # hay que rotarlo, avisar y reescribir la historia.
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: un secreto borrado en el commit siguiente sigue
          # estando en el objeto anterior, y es exactamente el caso que hay que
          # atrapar. Con el checkout superficial por defecto no se vería.
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
        env:
          # Fijada a propósito: que una versión nueva cambie las reglas por
          # debajo es justo lo que el auto-test de abajo tiene que detectar.
          GITLEAKS_VERSION: 8.21.2

      # Antes de confiar en el escáner, comprobar que dispara. Le pone delante
      # un secreto falso de cada forma que Yugo maneja de verdad y falla si
      # alguno pasa limpio. Sin este paso, una regla rota se vería igual que un
      # repositorio limpio.
      - name: El escáner detecta lo que tiene que detectar
        run: ./scripts/secret-scan-selftest.sh

      - name: Buscar secretos en toda la historia
        run: |
          gitleaks detect --source . --config .gitleaks.toml \
            --no-banner --redact --verbose \
            --report-format json --report-path gitleaks-report.json

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @yugo/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Coverage (domain services ≥ 70%, RNF-09)
        run: pnpm --filter @yugo/api test:cov

      # El bundle de Android tiene que resolver todos sus módulos. Es la
      # comprobación que atrapó un @babel/runtime ausente por la estructura del
      # monorepo, que habría roto el build en EAS. Las pantallas se montan sin
      # lanzar en `pnpm test` (apps/mobile/__tests__).
      - name: Mobile bundle resolves (expo export, Android)
        env:
          EXPO_PUBLIC_DEMO_MODE: 'true'
        run: pnpm --filter @yugo/mobile exec expo export --platform android --output-dir /tmp/expo-export

      - name: Build web + api + packages
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # La web importa @yugo/shared y @yugo/app-core desde su dist: en una
      # instalación limpia hay que construirlos antes que a ella.
      - name: Paquetes compartidos y cliente de Prisma
        run: |
          pnpm --filter @yugo/ui-tokens build
          pnpm --filter @yugo/shared build
          pnpm --filter @yugo/app-core build
          pnpm --filter @yugo/api exec prisma generate

      - name: Build web
        run: pnpm --filter @yugo/web build

      - name: Install Playwright browser
        run: pnpm --filter @yugo/web exec playwright install --with-deps chromium

      - name: E2E (web, admin, portal de iglesias)
        run: pnpm --filter @yugo/web e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: yugo
          POSTGRES_PASSWORD: yugo
          POSTGRES_DB: yugo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yugo -d yugo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # La semilla importa @yugo/shared desde su dist: sin construirlo antes,
      # tsx no lo encuentra en una instalación limpia.
      # La semilla importa @yugo/shared desde su dist y el cliente de Prisma
      # generado; sin los dos, falla antes de tocar la base.
      - name: Paquetes compartidos y cliente de Prisma
        run: |
          pnpm turbo run build --filter=@yugo/shared
          pnpm --filter @yugo/api exec prisma generate

      - name: Apply migrations and seed
        env:
          DATABASE_URL: postgresql://yugo:yugo@localhost:5432/yugo?schema=public
        run: |
          pnpm --filter @yugo/api db:deploy
          pnpm --filter @yugo/api db:seed

      # El esquema y las migraciones no pueden separarse en silencio.
      - name: Check for schema drift
        env:
          DATABASE_URL: postgresql://yugo:yugo@localhost:5432/yugo?schema=public
        run: |
          pnpm --filter @yugo/api exec prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      # Arrancar la API de verdad y hablarle por HTTP: sin este paso, ni el
      # entrypoint compilado ni las consultas SQL crudas se ejercitan nunca.
      - name: Build API
        run: pnpm --filter @yugo/api build

      - name: Start API
        env:
          DATABASE_URL: postgresql://yugo:yugo@localhost:5432/yugo?schema=public
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          OTP_PROVIDER: console
          NODE_ENV: test
        run: node apps/api/dist/main.js &

      - name: Smoke tests against the running API
        env:
          DATABASE_URL: postgresql://yugo:yugo@localhost:5432/yugo?schema=public
        run: pnpm --filter @yugo/api test:smoke

  # La web de verdad contra la API de verdad (RNF-09). Las E2E de arriba corren
  # en modo demo y no pueden ver un 500 real ni un contrato roto entre cliente
  # y servidor; este trabajo sí: levanta PostGIS, migra, siembra, arranca la
  # API compilada, construye la web sin demo y la recorre con una cuenta real.
  e2e-live:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: yugo
          POSTGRES_PASSWORD: yugo
          POSTGRES_DB: yugo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yugo -d yugo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://yugo:yugo@localhost:5432/yugo?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Paquetes compartidos y cliente de Prisma
        run: |
          pnpm --filter @yugo/ui-tokens build
          pnpm --filter @yugo/shared build
          pnpm --filter @yugo/app-core build
          pnpm --filter @yugo/api exec prisma generate

      - name: Migrar y sembrar
        run: |
          pnpm --filter @yugo/api db:deploy
          pnpm --filter @yugo/api db:seed

      - name: Construir y arrancar la API
        env:
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          OTP_PROVIDER: console
          PAYMENT_PROVIDER: stub
          WEB_URL: http://localhost:3211
          NODE_ENV: test
          PORT: '4000'
        run: |
          pnpm --filter @yugo/api build
          (node apps/api/dist/main.js > /tmp/api.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:4000/v1/health && break
            sleep 2
          done
          curl -sf http://localhost:4000/v1/health

      - name: Construir y servir la web sin modo demo
        env:
          NEXT_PUBLIC_DEMO_MODE: 'false'
          API_URL: http://localhost:4000
        run: |
          pnpm --filter @yugo/web build
          (pnpm --filter @yugo/web exec next start -p 3211 > /tmp/web.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:3211/estado > /dev/null && break
            sleep 2
          done

      - name: Chromium
        run: pnpm --filter @yugo/web exec playwright install --with-deps chromium

      - name: E2E contra la API real
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3211
          # La página /estado debe mostrar esta API, no la de desarrollo.
          LIVE_API_URL: http://localhost:4000
        run: pnpm --filter @yugo/web e2e:live

      - name: Logs de la API y la web si algo falló
        if: failure()
        run: |
          echo "== API =="; tail -n 200 /tmp/api.log || true
          echo "== WEB =="; tail -n 100 /tmp/web.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-live-report
          path: apps/web/playwright-report/
          retention-days: 7
