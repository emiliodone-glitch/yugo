name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Va primero y sin `needs`: es lo único que no tiene vuelta atrás. Un lint que
  # falla se arregla en el commit siguiente; un secreto que entra al historial
  # hay que rotarlo, avisar y reescribir la historia.
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: un secreto borrado en el commit siguiente sigue
          # estando en el objeto anterior, y es exactamente el caso que hay que
          # atrapar. Con el checkout superficial por defecto no se vería.
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
        env:
          # Fijada a propósito: que una versión nueva cambie las reglas por
          # debajo es justo lo que el auto-test de abajo tiene que detectar.
          GITLEAKS_VERSION: 8.21.2

      # Antes de confiar en el escáner, comprobar que dispara. Le pone delante
      # un secreto falso de cada forma que Yugo maneja de verdad y falla si
      # alguno pasa limpio. Sin este paso, una regla rota se vería igual que un
      # repositorio limpio.
      - name: El escáner detecta lo que tiene que detectar
        run: ./scripts/secret-scan-selftest.sh

      - name: Buscar secretos en toda la historia
        run: |
          gitleaks detect --source . --config .gitleaks.toml \
            --no-banner --redact --verbose \
            --report-format json --report-path gitleaks-report.json

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @yugo/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Coverage (domain services ≥ 70%, RNF-09)
        run: pnpm --filter @yugo/api test:cov

      - name: Build web + api + packages
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @yugo/api exec prisma generate

      - name: Build web
        run: pnpm --filter @yugo/web build

      - name: Install Playwright browser
        run: pnpm --filter @yugo/web exec playwright install --with-deps chromium

      - name: E2E (web, admin, portal de iglesias)
        run: pnpm --filter @yugo/web e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: yugo
          POSTGRES_PASSWORD: yugo
          POSTGRES_DB: yugo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yugo -d yugo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations and seed
        env:
          DATABASE_URL: postgresql://yugo:yugo@localhost:5432/yugo?schema=public
        run: |
          pnpm --filter @yugo/api db:deploy
          pnpm --filter @yugo/api db:seed

      # El esquema y las migraciones no pueden separarse en silencio.
      - name: Check for schema drift
        env:
          DATABASE_URL: postgresql://yugo:yugo@localhost:5432/yugo?schema=public
        run: |
          pnpm --filter @yugo/api exec prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      # Arrancar la API de verdad y hablarle por HTTP: sin este paso, ni el
      # entrypoint compilado ni las consultas SQL crudas se ejercitan nunca.
      - name: Build API
        run: pnpm --filter @yugo/api build

      - name: Start API
        env:
          DATABASE_URL: postgresql://yugo:yugo@localhost:5432/yugo?schema=public
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          OTP_PROVIDER: console
          NODE_ENV: test
        run: node apps/api/dist/main.js &

      - name: Smoke tests against the running API
        env:
          DATABASE_URL: postgresql://yugo:yugo@localhost:5432/yugo?schema=public
        run: pnpm --filter @yugo/api test:smoke
