name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @yugo/api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Coverage (domain services ≥ 70%, RNF-09)
        run: pnpm --filter @yugo/api test:cov

      - name: Build web + api + packages
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @yugo/api exec prisma generate

      - name: Build web
        run: pnpm --filter @yugo/web build

      - name: Install Playwright browser
        run: pnpm --filter @yugo/web exec playwright install --with-deps chromium

      - name: E2E (web, admin, portal de iglesias)
        run: pnpm --filter @yugo/web e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: yugo
          POSTGRES_PASSWORD: yugo
          POSTGRES_DB: yugo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yugo -d yugo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations and seed
        env:
          DATABASE_URL: postgresql://yugo:yugo@localhost:5432/yugo?schema=public
        run: |
          pnpm --filter @yugo/api db:deploy
          pnpm --filter @yugo/api db:seed
