name: Railway

# Despliega la API y la web en Railway.
#
# Corre solo en la rama principal y a mano. Necesita un único secreto en GitHub:
# RAILWAY_TOKEN (Railway → Project → Settings → Tokens). Sin él, el trabajo se
# detiene en el primer paso con un mensaje claro, en vez de fallar a medias.
#
# Lo que NO hace: crear el proyecto, la base PostGIS ni las variables. Eso se
# hace una vez siguiendo docs/RAILWAY.md; este flujo solo empuja código nuevo a
# servicios que ya existen. Las migraciones las aplica la propia API al
# arrancar (`prisma migrate deploy` en el CMD del contenedor).

on:
  push:
    # Cualquier rama; el trabajo de abajo solo corre en la rama por defecto del
    # repositorio (hoy no se llama `main`), así no hay que tocar esto si cambia.
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/railway.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Qué desplegar (ninguno = solo sembrar o probar; útil si Railway ya despliega desde GitHub)'
        type: choice
        default: ambos
        options: [ambos, api, web, ninguno]
      seed:
        description: 'Sembrar catálogo y datos de demo (solo la primera vez; necesita el secreto SEED_DATABASE_URL)'
        type: boolean
        default: false
      smoke:
        description: 'Correr la suite de humo contra la API desplegada (base recién sembrada)'
        type: boolean
        default: false

concurrency:
  group: railway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # A mano desde cualquier rama; por push, solo desde la rama por defecto.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    environment:
      name: railway
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # Nombres de los servicios tal como aparecen en el proyecto de Railway.
      # Si los llamaste distinto, cámbialos aquí o en las variables del repo.
      API_SERVICE: ${{ vars.RAILWAY_API_SERVICE || 'api' }}
      WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE || 'web' }}
    steps:
      - name: Comprobar que hay token
        if: ${{ github.event_name == 'push' || inputs.service != 'ninguno' }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Falta el secreto RAILWAY_TOKEN. Créalo en Railway (Project → Settings → Tokens) y guárdalo en GitHub → Settings → Secrets → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Instalar la CLI de Railway
        if: ${{ github.event_name == 'push' || inputs.service != 'ninguno' }}
        run: npm i -g @railway/cli

      - name: Desplegar la API
        if: ${{ github.event_name == 'push' || inputs.service == 'ambos' || inputs.service == 'api' }}
        # --ci evita la salida interactiva; el Dockerfile lo indica apps/api/railway.json.
        run: railway up --service "$API_SERVICE" --ci --detach

      - name: Desplegar la web
        if: ${{ github.event_name == 'push' || inputs.service == 'ambos' || inputs.service == 'web' }}
        run: railway up --service "$WEB_SERVICE" --ci --detach

      # La API dice si arrancó de verdad. Sin dominio configurado se omite.
      - name: Esperar a que la API esté sana
        if: ${{ vars.RAILWAY_API_URL != '' && (github.event_name == 'push' || inputs.service == 'ambos' || inputs.service == 'api') }}
        env:
          API_URL: ${{ vars.RAILWAY_API_URL }}
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "$API_URL/v1/health" | grep -q '"status":"ok"'; then
              echo "API sana en $API_URL"; exit 0
            fi
            sleep 10
          done
          echo "::error::La API no respondió sana en $API_URL tras ~7 minutos. Revisa los logs del servicio en Railway."
          exit 1

  # La semilla crea el catálogo que la app necesita (denominaciones, áreas de
  # servicio, documentos legales, ajustes) y además 40 perfiles ficticios para
  # la demo. Corre desde el runner de GitHub, así que la base tiene que ser
  # alcanzable desde fuera: en Railway, servicio postgres → Settings →
  # Networking → TCP Proxy, y esa URL pública va en el secreto SEED_DATABASE_URL.
  # El proxy se puede apagar después de sembrar.
  seed:
    needs: deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed }}
    runs-on: ubuntu-latest
    environment:
      name: railway
    steps:
      - name: Comprobar que hay SEED_DATABASE_URL
        env:
          SEED_DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
        run: |
          if [ -z "$SEED_DATABASE_URL" ]; then
            echo "::error::Falta el secreto SEED_DATABASE_URL (la URL pública de Postgres, vía TCP Proxy de Railway)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yugo/ui-tokens build && pnpm --filter @yugo/shared build && pnpm --filter @yugo/api prisma:generate
      - name: Sembrar
        env:
          DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
        run: pnpm --filter @yugo/api db:seed

  # 130 comprobaciones de extremo a extremo contra la API desplegada: registro,
  # Descubrir, conexión, chat, etapas, devocional, oración y moderación. Pide
  # una base recién sembrada; el limitador de inicio de sesión (10 por hora)
  # hace que repetirla enseguida falle por diseño, no por un defecto.
  smoke:
    needs: [deploy, seed]
    if: ${{ always() && needs.deploy.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.smoke && vars.RAILWAY_API_URL != '' && (needs.seed.result == 'success' || needs.seed.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: railway
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yugo/ui-tokens build && pnpm --filter @yugo/shared build && pnpm --filter @yugo/api prisma:generate
      - name: Suite de humo
        env:
          SMOKE_BASE_URL: ${{ vars.RAILWAY_API_URL }}/v1
          DATABASE_URL: ${{ secrets.SEED_DATABASE_URL }}
        run: pnpm --filter @yugo/api test:smoke
